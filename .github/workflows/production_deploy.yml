name: Production Deployment

on:
  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - "Dockerfile"
      - "nginx.conf"
      - ".github/workflows/production_deploy.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERCEL_CLI_VERSION: 50.28.0

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: runtime/package-lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install pnpm workspace dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build pnpm workspace packages
        run: pnpm build

      - name: Install runtime dependencies
        working-directory: runtime
        run: npm ci

      - name: Build @iskra/runtime
        working-directory: runtime
        run: npm run build

      - name: Lint runtime
        working-directory: runtime
        run: npm run lint

      - name: Install iskraSpace dependencies
        working-directory: runtime/iskraSpace
        run: npm ci

      - name: Run runtime tests
        working-directory: runtime
        run: npm run test -- --run

      - name: TypeCheck iskraSpace
        working-directory: runtime/iskraSpace
        run: npm run typecheck

      - name: Lint iskraSpace
        working-directory: runtime/iskraSpace
        run: npm run lint

      - name: Build iskraSpace
        working-directory: runtime/iskraSpace
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iskraspace-dist
          path: runtime/iskraSpace/dist/
          retention-days: 7

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install -g vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel Environment
        working-directory: runtime/iskraSpace
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel
        working-directory: runtime/iskraSpace
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel Production
        working-directory: runtime/iskraSpace
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
