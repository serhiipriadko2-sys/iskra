name: Production Deployment

on:
  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - "packages/**"
      - "supabase/**"
      - "deploy/**"
      - "tools/verify_supabase_*"
      - "ledger/**"
      - ".dockerignore"
      - "Dockerfile"
      - "nginx.conf"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/production_deploy.yml"
  workflow_dispatch:
    inputs:
      confirm_live_supabase_acceptance:
        description: "Confirm a current live Supabase parity/advisory/isolation acceptance receipt exists"
        required: true
        default: false
        type: boolean
      deploy_vercel_preview:
        description: "Run optional non-production Vercel preview"
        required: false
        default: false
        type: boolean

concurrency:
  group: iskraspace-production-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  VERCEL_CLI_VERSION: 50.28.0

jobs:
  release-gates:
    name: IskraSpace release gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.x

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install legacy runtime dependencies
        working-directory: runtime
        run: npm ci --ignore-scripts

      - name: Build and test legacy runtime
        working-directory: runtime
        run: |
          npm run build
          npm run lint:strict
          npm run test -- --run

      - name: Typecheck IskraSpace
        run: pnpm --filter iskra-space typecheck

      - name: Lint IskraSpace without warnings
        run: pnpm --filter iskra-space lint:strict

      - name: Unit tests pass 1
        run: pnpm --filter iskra-space test:run

      - name: Unit tests pass 2
        run: pnpm --filter iskra-space test:run

      - name: Check Edge Function source with Deno
        run: |
          deno test --no-lock runtime/iskraSpace/supabase/functions/_shared/aiContentPolicy_test.ts
          deno test --no-lock runtime/iskraSpace/supabase/functions/_shared/aiBoundary_test.ts
          deno check --frozen --lock runtime/iskraSpace/supabase/functions/gemini/deno.lock --config runtime/iskraSpace/supabase/functions/gemini/deno.json runtime/iskraSpace/supabase/functions/gemini/index.ts
          deno check --no-lock --config runtime/iskraSpace/supabase/functions/iskra-agent/deno.json runtime/iskraSpace/supabase/functions/iskra-agent/index.ts

      - name: Dependency audits
        shell: bash
        run: |
          # pnpm 10 uses npm's retired quick-audit endpoint. Run the pinned
          # bulk-advisory client from outside the workspace so it cannot
          # delegate back to packageManager: pnpm@10.32.1.
          (
            cd "$RUNNER_TEMP"
            npx --yes pnpm@11.13.0 \
              --dir "$GITHUB_WORKSPACE" \
              --pm-on-fail=ignore \
              audit --audit-level moderate
          )
          cd runtime
          npm audit --audit-level moderate

      - name: Supabase repository contracts
        run: |
          pnpm check:supabase-graph-contract:repo
          pnpm check:supabase-voice-metrics-contract:repo

      - name: SoT ledger integrity
        run: npx tsx tools/verify_ledger.ts

      - name: Build IskraSpace
        run: |
          pnpm --filter iskra-space build
          pnpm --filter iskra-space check:bundle-budget

      - name: Install Chromium
        run: pnpm --dir runtime/iskraSpace exec playwright install --with-deps chromium

      - name: Chromium E2E
        run: pnpm --dir runtime/iskraSpace exec playwright test --project=chromium

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iskraspace-dist
          path: runtime/iskraSpace/dist/
          retention-days: 7

  docker-smoke-and-push:
    name: Docker smoke and GHCR push
    runs-on: ubuntu-latest
    needs: release-gates
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_live_supabase_acceptance }}
    environment: production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm for production browser smoke
        uses: pnpm/action-setup@v4

      - name: Setup Node.js for production browser smoke
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install production browser smoke dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir runtime/iskraSpace exec playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable candidate image
        id: candidate
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:candidate-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Pull exact candidate digest
        run: docker pull "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.candidate.outputs.digest }}"

      - name: Reject unsafe browser runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.candidate.outputs.digest }}"
          secret_key="sb_$(printf '%s' 'secret_never_browser_visible')"
          service_role_payload="$(printf '%s' '{"role":"service_role"}' | base64 | tr '+/' '-_' | tr -d '=\n')"
          service_role_jwt="e30.${service_role_payload}.signature"
          if docker run --rm \
            --env VITE_SUPABASE_URL=https://evil.invalid/path.supabase.co \
            --env VITE_SUPABASE_ANON_KEY=sb_publishable_smoke_public_only \
            "$image"; then
            echo "Deceptive Supabase URL was accepted" >&2
            exit 1
          fi
          if docker run --rm \
            --env VITE_SUPABASE_URL=https://smoke.supabase.co \
            --env VITE_SUPABASE_ANON_KEY="$secret_key" \
            "$image"; then
            echo "Supabase secret key was accepted as browser configuration" >&2
            exit 1
          fi
          if docker run --rm \
            --env VITE_SUPABASE_URL=https://smoke.supabase.co \
            --env VITE_SUPABASE_ANON_KEY="$service_role_jwt" \
            "$image"; then
            echo "Legacy service_role JWT was accepted as browser configuration" >&2
            exit 1
          fi

      - name: Run Docker smoke assertions
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach --name iskraspace-smoke --publish 18080:8080 \
            --env VITE_SUPABASE_URL=https://smoke.supabase.co \
            --env VITE_SUPABASE_ANON_KEY=sb_publishable_smoke_public_only \
            --env VITE_APP_VERSION=${{ github.sha }} \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.candidate.outputs.digest }}"
          trap 'docker rm --force iskraspace-smoke >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health >/tmp/health.txt; then
              break
            fi
            sleep 1
          done
          grep --fixed-strings --line-regexp "healthy" /tmp/health.txt
          curl --fail --silent --show-error --head http://127.0.0.1:18080/health >/tmp/health-headers.txt
          curl --fail --silent --show-error http://127.0.0.1:18080/ >/tmp/index.html
          curl --fail --silent --show-error --head http://127.0.0.1:18080/ >/tmp/root-headers.txt
          curl --fail --silent --show-error http://127.0.0.1:18080/runtime-config.js >/tmp/runtime-config.js
          curl --fail --silent --show-error --head http://127.0.0.1:18080/runtime-config.js >/tmp/runtime-config-headers.txt
          grep --fixed-strings 'VITE_SUPABASE_URL: "https://smoke.supabase.co"' /tmp/runtime-config.js
          if grep --ignore-case 'service.role' /tmp/runtime-config.js; then
            echo "Service-role material is forbidden in runtime-config.js" >&2
            exit 1
          fi
          asset_path="$(grep --only-matching --extended-regexp 'src="/assets/[^"]+\.js"' /tmp/index.html | head -n 1 | cut -d '"' -f 2)"
          test -n "$asset_path"
          curl --fail --silent --show-error --head "http://127.0.0.1:18080${asset_path}" >/tmp/asset-headers.txt
          for headers in /tmp/root-headers.txt /tmp/health-headers.txt /tmp/asset-headers.txt /tmp/runtime-config-headers.txt; do
            grep --ignore-case '^Content-Security-Policy:' "$headers"
            if grep --ignore-case '^Access-Control-Allow-Origin: \*' "$headers"; then
              echo "Wildcard CORS is forbidden in $headers" >&2
              exit 1
            fi
          done
          grep --ignore-case '^Cache-Control:.*no-cache' /tmp/runtime-config-headers.txt
          curl --fail --silent http://127.0.0.1:18080/deep/spa/route | grep --fixed-strings '<div id="root"></div>'
          ISKRA_PRODUCTION_BASE_URL=http://127.0.0.1:18080 \
            pnpm --dir runtime/iskraSpace exec playwright test \
              --config playwright.production.config.ts \
              --project=chromium-production

      - name: Promote the smoke-tested digest
        shell: bash
        run: |
          set -euo pipefail
          image="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          short_sha="${GITHUB_SHA::7}"
          docker buildx imagetools create \
            --tag "${image}:main-${short_sha}" \
            --tag "${image}:latest" \
            "${image}@${{ steps.candidate.outputs.digest }}"

      - name: Generate release receipt
        shell: bash
        run: |
          mkdir -p release-receipt
          {
            echo "# IskraSpace release receipt"
            echo
            echo "- commit_sha: $GITHUB_SHA"
            echo "- image_digest: ${{ steps.candidate.outputs.digest }}"
            echo "- candidate_tag: candidate-${GITHUB_SHA}"
            echo "- canonical_surface: GHCR Docker image"
            echo "- live_supabase_acceptance_operator_confirmed: true"
            echo "- gates: typecheck, zero-warning lint, unit x2, Deno, audit, Supabase contracts, ledger, Chromium E2E, Docker smoke"
            echo
            echo "## Environment key inventory (names only)"
            sed -n 's/^\([A-Z][A-Z0-9_]*\)=.*/- \1/p' runtime/iskraSpace/.env.production.example | sort
            sed -n 's/^\([A-Z][A-Z0-9_]*\)=.*/- \1/p' supabase/.env.example | sort
          } > release-receipt/RELEASE_RECEIPT.md
          wc --bytes release-receipt/RELEASE_RECEIPT.md > release-receipt/RELEASE_RECEIPT.bytes
          sha256sum release-receipt/RELEASE_RECEIPT.md > release-receipt/RELEASE_RECEIPT.sha256

      - name: Upload release receipt
        uses: actions/upload-artifact@v4
        with:
          name: iskraspace-release-receipt-${{ github.sha }}
          path: release-receipt/
          retention-days: 90

  deploy-vercel-preview:
    name: Deploy Vercel preview (non-production)
    runs-on: ubuntu-latest
    needs: release-gates
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_vercel_preview == true }}
    env:
      VERCEL_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Vercel CLI
        run: npm install -g vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Deploy Vercel preview
        working-directory: runtime/iskraSpace
        run: |
          vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
          vercel build --token="$VERCEL_TOKEN"
          vercel deploy --prebuilt --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
