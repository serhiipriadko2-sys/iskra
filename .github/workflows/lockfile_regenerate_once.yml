name: Lockfile Regenerate Once

on:
  push:
    branches:
      - codex/restore-lockfile-discipline-20260530
    paths:
      - ".github/workflows/lockfile_regenerate_once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/codex/restore-lockfile-discipline-20260530'
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/restore-lockfile-discipline-20260530
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Regenerate lockfile only
        run: pnpm install --lockfile-only

      - name: Commit lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already up to date"
          else
            git commit -m "fix(ci): refresh pnpm lockfile importer"
            git push origin HEAD:codex/restore-lockfile-discipline-20260530
          fi
