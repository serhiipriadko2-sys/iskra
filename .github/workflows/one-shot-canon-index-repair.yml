name: One-shot canon index repair

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Generate canon index
        working-directory: apps/iskra-site
        run: pnpm canon:index:generate
      - name: Verify ledger
        run: npx tsx tools/verify_ledger.ts
      - name: Commit generated repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add apps/iskra-site/src/data/canon-index.json ledger/sot.json ledger/checksum.asc
          git diff --cached --quiet || git commit -m "fix(sot30): regenerate canon index after receipt integration"
          git push
