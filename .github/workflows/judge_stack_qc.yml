name: Judge Stack QC

on:
  push:
    paths:
      - '.github/workflows/judge_stack_qc.yml'
      - 'ScienceAndTests/ACTIVE_JUDGE_STACK'
      - 'ScienceAndTests/independent_judge_chatgpt_projects_stack_*/**'
      - 'ScienceAndTests/INDEPENDENT_JUDGE_CHATGPT_PROJECTS_STACK_*.zip'
      - 'ScienceAndTests/INDEPENDENT_JUDGE_CHATGPT_PROJECTS_STACK_*.receipt.json'
  pull_request:
    paths:
      - '.github/workflows/judge_stack_qc.yml'
      - 'ScienceAndTests/ACTIVE_JUDGE_STACK'
      - 'ScienceAndTests/independent_judge_chatgpt_projects_stack_*/**'
      - 'ScienceAndTests/INDEPENDENT_JUDGE_CHATGPT_PROJECTS_STACK_*.zip'
      - 'ScienceAndTests/INDEPENDENT_JUDGE_CHATGPT_PROJECTS_STACK_*.receipt.json'

jobs:
  judge-qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve explicit active judge stack
        id: stack
        shell: bash
        run: |
          set -euo pipefail
          NAME="$(tr -d '\r\n' < ScienceAndTests/ACTIVE_JUDGE_STACK)"
          DIR="ScienceAndTests/${NAME}"
          test -d "$DIR"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Static pack validation (exit-coded)
        run: python3 "${{ steps.stack.outputs.dir }}/OPERATOR_SUPPORT/tools/validate_pack.py" "${{ steps.stack.outputs.dir }}"

      - name: Dynamic mutation tests
        run: python3 "${{ steps.stack.outputs.dir }}/OPERATOR_SUPPORT/tests/test_dynamic.py"

      - name: Skill pack QC (exit-coded)
        run: python3 "${{ steps.stack.outputs.dir }}/SKILL_SOURCES/judge-bias-calibration/scripts/pack_qc.py" --knowledge "${{ steps.stack.outputs.dir }}/UPLOAD_TO_PROJECT/knowledge"

      - name: Round-trip ZIP, manifest, cache, sidecar and exact-count verification
        shell: bash
        run: |
          set -euo pipefail
          VERSION="v3.5-rc.3"
          ZIP="ScienceAndTests/INDEPENDENT_JUDGE_CHATGPT_PROJECTS_STACK_${VERSION}.zip"
          RECEIPT="ScienceAndTests/INDEPENDENT_JUDGE_CHATGPT_PROJECTS_STACK_${VERSION}.receipt.json"
          python3 "${{ steps.stack.outputs.dir }}/OPERATOR_SUPPORT/tools/verify_release.py" \
            --root "${{ steps.stack.outputs.dir }}" \
            --archive "$ZIP" \
            --sidecar "$RECEIPT"
