name: PR309 temporary ledger refresh

on:
  push:
    branches:
      - ci/fail-if-no-match-20260728
    paths:
      - ".github/workflows/pr309_ledger_refresh_temp.yml"

permissions:
  contents: write

jobs:
  refresh-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/fail-if-no-match-20260728
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Remove temporary workflow before regeneration
        run: rm .github/workflows/pr309_ledger_refresh_temp.yml
      - name: Regenerate canonical ledger
        run: npx tsx tools/update_ledger.ts
      - name: Verify regenerated ledger
        run: npx tsx tools/verify_ledger.ts
      - name: Commit self-removal and regenerated ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/pr309_ledger_refresh_temp.yml ledger/sot.json ledger/checksum.asc
          git commit -m "chore(ledger): regenerate after CI filter hardening"
          git push origin HEAD:ci/fail-if-no-match-20260728
