name: SoT integrity

on:
  push:
    paths:
      - "core/**"
      - "system/**"
      - "governance/**"
      - "metrics/**"
      - "mind/**"
      - "appendix/**"
      - "ledger/**"
      - "ingest/**"
      - "tools/**"
      - "package.json"
      - "manifest.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LIBER_INITIUM.md"
      - "ISKRA_MANIFEST.md"
      - ".github/workflows/sot_integrity.yml"
  pull_request:

permissions:
  contents: write

jobs:
  refresh-lockfile-on-branch:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/restore-lockfile-discipline-20260530'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/restore-lockfile-discipline-20260530
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only

      - name: Commit pnpm lockfile if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "pnpm-lock.yaml already up to date"
          else
            git commit -m "fix(ci): refresh pnpm lockfile importer"
            git push origin HEAD:codex/restore-lockfile-discipline-20260530
          fi

  hash-check:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || github.ref != 'refs/heads/codex/restore-lockfile-discipline-20260530'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify SoT hashes (ledger/sot.json)
        run: npx tsx tools/verify_ledger.ts

      - name: Verify package boundaries (no deep src imports)
        run: python tools/check_no_src_imports.py

      - name: Validate declarative SoT40 scope manifest
        run: python tools/verify_sot40_scope.py

      - name: Build SoT40 artifact and receipt
        run: python tools/build_sot40_artifact.py --out-dir dist/sot40

      - name: Verify SoT40 receipt
        run: python tools/verify_sot40_receipt.py --receipt dist/sot40/receipt.json

  ingest-stage-checks:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && !(github.event_name == 'push' && github.ref == 'refs/heads/codex/restore-lockfile-discipline-20260530') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate shard registry consistency
        run: python tools/check_shard_registry_consistency.py

      - name: Verify ingestion chain
        run: |
          python tools/build_phase1_classification.py
          python tools/check_core_adr_gate.py core/mantra.md governance/adr.md
          npx tsx tools/verify_ledger.ts