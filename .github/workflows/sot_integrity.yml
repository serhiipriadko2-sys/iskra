name: SoT integrity

on:
  push:
    paths:
      - "core/**"
      - "system/**"
      - "governance/**"
      - "metrics/**"
      - "mind/**"
      - "appendix/**"
      - "ledger/**"
      - "ingest/**"
      - "tools/import_phase1_shard.py"
      - "tools/import_phase1_shard1.py"
      - "tools/import_phase1_shard2.py"
      - "tools/import_phase1_shard3.py"
      - "tools/check_shard_registry_consistency.py"
      - "package.json"
      - "manifest.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LIBER_INITIUM.md"
      - "ISKRA_MANIFEST.md"
      - ".github/workflows/sot_integrity.yml"
  pull_request:

jobs:
  hash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify SoT hashes (ledger/sot.json)
        run: |
          python - << 'PY'
          import json, hashlib, os, sys
          base="."
          with open("ledger/sot.json","r",encoding="utf-8") as f:
            sot=json.load(f)
          bad=[]
          for rel, expected in sot["sha256"].items():
            path=os.path.join(base, rel)
            if not os.path.exists(path):
              bad.append((rel,"missing"))
              continue
            h=hashlib.sha256()
            with open(path,"rb") as fp:
              for chunk in iter(lambda: fp.read(8192), b""):
                h.update(chunk)
            got=h.hexdigest()
            if got!=expected:
              bad.append((rel,f"expected {expected} got {got}"))
          if bad:
            print("Hash mismatches:")
            for rel, msg in bad:
              print(" -", rel, msg)
            sys.exit(1)
          print("OK: all hashes match ledger/sot.json")
          PY

  ingest-stage-checks:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate shard registry consistency
        run: python tools/check_shard_registry_consistency.py

      - name: Verify ingestion chain
        run: |
          python tools/build_phase1_classification.py
          python tools/check_core_adr_gate.py core/mantra.md governance/adr.md
          python tools/verify_ledger.py
