name: SoT integrity

on:
  push:
    paths:
      - "core/**"
      - "system/**"
      - "governance/**"
      - "metrics/**"
      - "mind/**"
      - "appendix/**"
      - "ledger/**"
      - "tools/**"
      - "manifest.yml"
      - "README.md"
      - "CONTRIBUTING.md"
      - "LIBER_INITIUM.md"
      - "ISKRA_MANIFEST.md"
      - ".github/workflows/sot_integrity.yml"
  pull_request:

jobs:
  hash-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify SoT hashes (ledger/sot.json)
        run: python tools/verify_ledger.py

      - name: Verify package boundaries (no deep src imports)
        run: python tools/check_no_src_imports.py

      - name: Validate declarative SoT40 scope manifest
        run: python tools/verify_sot40_scope.py

      - name: Build SoT40 artifact and receipt
        run: python tools/build_sot40_artifact.py --out-dir dist/sot40

      - name: Verify SoT40 receipt
        run: python tools/verify_sot40_receipt.py --receipt dist/sot40/receipt.json
