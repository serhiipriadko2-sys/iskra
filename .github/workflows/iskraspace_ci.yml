name: iskraSpace CI

on:
  push:
    paths:
      - "runtime/iskraSpace/**"
      - "runtime/src/**"
      - "runtime/package*.json"
      - "packages/core/**"
      - "packages/math/**"
      - "supabase/**"
      - "deploy/**"
      - "Dockerfile"
      - "nginx.conf"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/iskraspace_ci.yml"
      - ".github/workflows/production_deploy.yml"
      - ".github/workflows/github_pages.yml"
  pull_request:
    paths:
      - "runtime/iskraSpace/**"
      - "runtime/src/**"
      - "runtime/package*.json"
      - "packages/core/**"
      - "packages/math/**"
      - "supabase/**"
      - "deploy/**"
      - "Dockerfile"
      - "nginx.conf"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/iskraspace_ci.yml"
      - ".github/workflows/production_deploy.yml"
      - ".github/workflows/github_pages.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.x

      - name: Install workspace dependencies
        working-directory: .
        shell: bash
        run: |
          set -o pipefail
          { node --version; pnpm --version; pnpm install --frozen-lockfile; } 2>&1 | tee runtime/workspace-install.log

      - name: Install legacy runtime dependencies
        shell: bash
        run: |
          set -o pipefail
          { node --version; npm --version; npm ci --ignore-scripts; } 2>&1 | tee runtime-install.log

      - name: Build @iskra/runtime
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee runtime-build.log

      - name: TypeScript typecheck
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          pnpm typecheck 2>&1 | tee iskraspace-typecheck.log

      - name: Lint
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          pnpm lint:strict 2>&1 | tee iskraspace-lint.log

      - name: Run unit tests pass 1
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          pnpm test:run -- --pool=threads --maxWorkers=2 2>&1 | tee iskraspace-unit.log

      - name: Run unit tests pass 2
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          pnpm test:run -- --pool=threads --maxWorkers=2 2>&1 | tee iskraspace-unit-repeat.log

      - name: Verify Edge metrics parity with canonical math
        working-directory: .
        run: pnpm check:iskra-metrics-parity

      - name: Verify no GraphQL client surface
        working-directory: .
        run: pnpm check:no-graphql-clients

      - name: Test Edge metrics atom
        working-directory: .
        run: deno test --no-lock supabase/functions/_shared/iskra-metrics/iskra-metrics_test.ts

      - name: Build iskraSpace
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          pnpm build 2>&1 | tee iskraspace-build.log
          pnpm check:bundle-budget 2>&1 | tee -a iskraspace-build.log

      - name: Upload iskraSpace diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: iskraspace-ci-diagnostics
          path: |
            runtime/workspace-install.log
            runtime/runtime-install.log
            runtime/runtime-build.log
            runtime/iskraSpace/iskraspace-typecheck.log
            runtime/iskraSpace/iskraspace-lint.log
            runtime/iskraSpace/iskraspace-unit.log
            runtime/iskraSpace/iskraspace-unit-repeat.log
            runtime/iskraSpace/iskraspace-build.log
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: .
        shell: bash
        run: |
          set -o pipefail
          { node --version; pnpm --version; pnpm install --frozen-lockfile; } 2>&1 | tee runtime/workspace-install-e2e.log

      - name: Install legacy runtime dependencies
        shell: bash
        run: |
          set -o pipefail
          { node --version; npm --version; npm ci --ignore-scripts; } 2>&1 | tee runtime-install-e2e.log

      - name: Build @iskra/runtime
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee runtime-build-e2e.log

      - name: Install Playwright browsers
        working-directory: runtime/iskraSpace
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          pnpm exec playwright test --project=chromium 2>&1 | tee iskraspace-e2e.log

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: runtime/iskraSpace/playwright-report/
          retention-days: 7

      - name: Upload iskraSpace e2e diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: iskraspace-e2e-diagnostics
          path: |
            runtime/workspace-install-e2e.log
            runtime/runtime-install-e2e.log
            runtime/runtime-build-e2e.log
            runtime/iskraSpace/iskraspace-e2e.log
          retention-days: 7
