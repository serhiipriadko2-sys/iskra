name: iskraSpace CI

on:
  push:
    paths:
      - "runtime/iskraSpace/**"
      - ".github/workflows/iskraspace_ci.yml"
  pull_request:
    paths:
      - "runtime/iskraSpace/**"
      - ".github/workflows/iskraspace_ci.yml"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: runtime/package-lock.json

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -o pipefail
          (npm ci --ignore-scripts || npm install --ignore-scripts) 2>&1 | tee runtime-install.log

      - name: Build @iskra/runtime
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee runtime-build.log

      - name: Install iskraSpace dependencies
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          (npm ci || npm install) 2>&1 | tee iskraspace-install.log

      - name: TypeScript typecheck
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee iskraspace-typecheck.log

      - name: Lint
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee iskraspace-lint.log

      - name: Run unit tests
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          npm run test:run 2>&1 | tee iskraspace-unit.log

      - name: Build iskraSpace
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee iskraspace-build.log

      - name: Upload iskraSpace diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: iskraspace-ci-diagnostics
          path: |
            runtime/runtime-install.log
            runtime/runtime-build.log
            runtime/iskraSpace/iskraspace-install.log
            runtime/iskraSpace/iskraspace-typecheck.log
            runtime/iskraSpace/iskraspace-lint.log
            runtime/iskraSpace/iskraspace-unit.log
            runtime/iskraSpace/iskraspace-build.log
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: runtime/package-lock.json

      - name: Install runtime dependencies
        shell: bash
        run: |
          set -o pipefail
          (npm ci --ignore-scripts || npm install --ignore-scripts) 2>&1 | tee runtime-install-e2e.log

      - name: Build @iskra/runtime
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee runtime-build-e2e.log

      - name: Install iskraSpace dependencies
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          (npm ci || npm install) 2>&1 | tee iskraspace-install-e2e.log

      - name: Install Playwright browsers
        working-directory: runtime/iskraSpace
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: runtime/iskraSpace
        shell: bash
        run: |
          set -o pipefail
          npx playwright test --project=chromium 2>&1 | tee iskraspace-e2e.log

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: runtime/iskraSpace/playwright-report/
          retention-days: 7

      - name: Upload iskraSpace e2e diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: iskraspace-e2e-diagnostics
          path: |
            runtime/runtime-install-e2e.log
            runtime/runtime-build-e2e.log
            runtime/iskraSpace/iskraspace-install-e2e.log
            runtime/iskraSpace/iskraspace-e2e.log
          retention-days: 7
