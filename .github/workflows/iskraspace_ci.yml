name: iskraSpace CI

on:
  push:
    paths:
      - "runtime/iskraSpace/**"
      - ".github/workflows/iskraspace_ci.yml"
  pull_request:
    paths:
      - "runtime/iskraSpace/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: runtime/package-lock.json

      - name: Install runtime dependencies
        run: npm ci

      - name: Build @iskra/runtime
        run: npm run build

      - name: Install iskraSpace dependencies
        working-directory: runtime/iskraSpace
        run: npm ci

      - name: TypeScript typecheck
        working-directory: runtime/iskraSpace
        run: npm run typecheck

      - name: Lint
        working-directory: runtime/iskraSpace
        run: npm run lint

      - name: Run unit tests
        working-directory: runtime/iskraSpace
        run: npm run test:run

      - name: Build iskraSpace
        working-directory: runtime/iskraSpace
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: build-and-test
    defaults:
      run:
        working-directory: runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: runtime/package-lock.json

      - name: Install runtime dependencies
        run: npm ci

      - name: Build @iskra/runtime
        run: npm run build

      - name: Install iskraSpace dependencies
        working-directory: runtime/iskraSpace
        run: npm ci

      - name: Install Playwright browsers
        working-directory: runtime/iskraSpace
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: runtime/iskraSpace
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: runtime/iskraSpace/playwright-report/
          retention-days: 7
