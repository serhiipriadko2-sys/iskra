name: Fractal authority bootstrap

on:
  push:
    branches:
      - feat/math-fractal-authority-v1
    paths:
      - '.github/workflows/fractal_authority_bootstrap.yml'
      - '.github/fractal-authority.finalize.trigger'
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - '.github/workflows/fractal_authority_bootstrap.yml'
      - '.github/fractal-authority.finalize.trigger'

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/math-fractal-authority-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair T7 corpus tuple contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'packages/math/src/__tests__/fractal-authority.test.ts'
          const source = fs.readFileSync(path, 'utf8')
          const before = `  it.each([
              Array.from({ length: 80 }, () => 0.25),
              Array.from({ length: 80 }, (_, index) => index / 80),
              periodic(80),
              Array.from({ length: 80 }, (_, index) => (index % 2 === 0 ? -1 : 1)),
              seededNoise(80),
            ])('T7: deterministic corpus case produces finite scalars', (values) => {`
          const after = `  it.each([
              [Array.from({ length: 80 }, () => 0.25)],
              [Array.from({ length: 80 }, (_, index) => index / 80)],
              [periodic(80)],
              [Array.from({ length: 80 }, (_, index) => (index % 2 === 0 ? -1 : 1))],
              [seededNoise(80)],
            ])('T7: deterministic corpus case produces finite scalars', (values) => {`
          if (!source.includes(before)) {
            throw new Error('T7 target block not found exactly once')
          }
          const patched = source.replace(before, after)
          if (patched === source || patched.includes(before)) {
            throw new Error('T7 tuple repair was not applied deterministically')
          }
          fs.writeFileSync(path, patched, 'utf8')
          NODE

      - name: Verify generator, boundary, and targeted Node tests
        shell: bash
        run: |
          set -euo pipefail
          node tools/generate-fractal-authority-mirrors.mjs --check
          node tools/check-fractal-authority-boundary.mjs
          pnpm exec vitest run \
            packages/math/src/__tests__/fractal-authority.test.ts \
            packages/math/src/__tests__/edgeMetricsParity.test.ts \
            packages/engine/src/__tests__/metricsServiceFractalAuthority.test.ts \
            runtime/src/__tests__/fractalAuthority.test.ts

      - name: Typecheck legacy runtime
        working-directory: runtime
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run test -- --run src/__tests__/fractalAuthority.test.ts

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run generated Edge contract tests
        run: deno test --no-lock supabase/functions/_shared/iskra-metrics/iskra-metrics_test.ts

      - name: Precompute ledger for final workflow topology
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/fractal_authority_bootstrap.yml /tmp/fractal_authority_bootstrap.yml
          cp .github/fractal-authority.workflow.yml.stage /tmp/fractal_authority.yml
          cp /tmp/fractal_authority.yml .github/workflows/fractal_authority.yml
          rm .github/workflows/fractal_authority_bootstrap.yml
          rm .github/fractal-authority.workflow.yml.stage
          rm -f .github/fractal-authority.finalize.trigger
          git add -A .github
          pnpm exec tsx tools/update_ledger.ts
          pnpm exec tsx tools/verify_ledger.ts
          git reset HEAD -- \
            .github/workflows/fractal_authority.yml \
            .github/workflows/fractal_authority_bootstrap.yml \
            .github/fractal-authority.workflow.yml.stage \
            .github/fractal-authority.finalize.trigger
          rm -f .github/workflows/fractal_authority.yml
          cp /tmp/fractal_authority_bootstrap.yml .github/workflows/fractal_authority_bootstrap.yml
          cp /tmp/fractal_authority.yml .github/fractal-authority.workflow.yml.stage

      - name: Commit T7 repair and final-tree ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            packages/math/src/__tests__/fractal-authority.test.ts \
            ledger/sot.json \
            ledger/checksum.asc
          git diff --cached --check
          git diff --cached --name-only | sort > /tmp/actual-paths
          printf '%s\n' \
            ledger/checksum.asc \
            ledger/sot.json \
            packages/math/src/__tests__/fractal-authority.test.ts | sort > /tmp/expected-paths
          diff -u /tmp/expected-paths /tmp/actual-paths
          git commit -m 'test(math): repair T7 tuple corpus and finalize ledger'
          git push origin HEAD:feat/math-fractal-authority-v1
