name: Fractal authority bootstrap

on:
  push:
    branches:
      - feat/math-fractal-authority-v1
    paths:
      - '.github/fractal-authority-stage.part*.b64'
      - '.github/workflows/fractal_authority_bootstrap.yml'

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/math-fractal-authority-v1
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Materialize verified change set
        shell: bash
        run: |
          set -euo pipefail
          cat .github/fractal-authority-stage.part*.b64 | tr -d '\r\n' | base64 -d > /tmp/fractal-authority-stage.zip
          echo 'fb7e7ed7dedb362e4c2a54ab0bc69b691f14ca28e55e74d07487e93649c24fbd  /tmp/fractal-authority-stage.zip' | sha256sum -c -
          unzip -o /tmp/fractal-authority-stage.zip -d .
          rm -f .github/fractal-authority-stage.part*.b64
          rm -f .github/workflows/fractal_authority_bootstrap.yml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify implementation and regenerate ledger
        shell: bash
        run: |
          set -euo pipefail
          node tools/generate-fractal-authority-mirrors.mjs --check
          pnpm exec vitest run \
            packages/math/src/__tests__/fractal-authority.test.ts \
            packages/math/src/__tests__/edgeMetricsParity.test.ts \
            packages/engine/src/__tests__/metricsServiceFractalAuthority.test.ts \
            runtime/src/__tests__/fractalAuthority.test.ts
          node tools/check-fractal-authority-boundary.mjs
          pnpm exec tsx tools/update_ledger.ts
          pnpm exec tsx tools/verify_ledger.ts

      - name: Commit materialized implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(math): implement typed HFD/DFA authority boundary'
          git push origin HEAD:feat/math-fractal-authority-v1
