name: Ledger repair artifact

on:
  pull_request:
    paths:
      - ".github/workflows/ledger_repair_artifact.yml"
      - "ledger/**"
      - "tools/update_ledger.ts"

permissions:
  contents: write

jobs:
  generate-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove temporary workflow before hashing
        run: rm .github/workflows/ledger_repair_artifact.yml
      - name: Regenerate ledger with repository tool
        run: pnpm ledger:update
      - name: Verify regenerated ledger
        run: npx tsx tools/verify_ledger.ts
      - name: Commit clean ledger repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger/sot.json ledger/checksum.asc .github/workflows/ledger_repair_artifact.yml
          git commit -m "fix(ledger): regenerate SoT hashes from current main"
          git push origin HEAD:${{ github.head_ref }}
