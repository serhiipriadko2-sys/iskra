name: P0 Strict AI Contract Gate

on:
  push:
    branches:
      - hardening/iskraspace-p0-storage-isolation-v2
    paths:
      - "runtime/iskraSpace/supabase/functions/_shared/aiContentPolicy*.ts"
      - "runtime/iskraSpace/supabase/functions/gemini/index.ts"
      - "runtime/iskraSpace/supabase/functions/iskra-agent/index.ts"
      - "runtime/iskraSpace/services/__tests__/aiContentPolicyRuntime.test.ts"
      - "runtime/iskraSpace/services/__tests__/geminiEdgeFunctionSecurity.test.ts"
      - "runtime/iskraSpace/services/__tests__/iskraAgentEdgeFunctionSecurity.test.ts"
      - ".github/workflows/p0_strict_ai_contract_gate.yml"
  pull_request:
    branches:
      - main
    paths:
      - "runtime/iskraSpace/supabase/functions/_shared/aiContentPolicy*.ts"
      - "runtime/iskraSpace/supabase/functions/gemini/index.ts"
      - "runtime/iskraSpace/supabase/functions/iskra-agent/index.ts"
      - "runtime/iskraSpace/services/__tests__/aiContentPolicyRuntime.test.ts"
      - "runtime/iskraSpace/services/__tests__/geminiEdgeFunctionSecurity.test.ts"
      - "runtime/iskraSpace/services/__tests__/iskraAgentEdgeFunctionSecurity.test.ts"
      - ".github/workflows/p0_strict_ai_contract_gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p0-strict-ai-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  strict-ai-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.x

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck IskraSpace
        run: pnpm --dir runtime/iskraSpace typecheck

      - name: Run strict ingress Vitest suites
        run: >-
          pnpm --dir runtime/iskraSpace exec vitest run
          services/__tests__/aiContentPolicyRuntime.test.ts
          services/__tests__/geminiEdgeFunctionSecurity.test.ts
          services/__tests__/iskraAgentEdgeFunctionSecurity.test.ts
          --reporter=verbose

      - name: Run Deno policy suite
        run: deno test --no-lock runtime/iskraSpace/supabase/functions/_shared/aiContentPolicy_test.ts

      - name: Check live Edge handlers
        run: |
          deno check --frozen --lock runtime/iskraSpace/supabase/functions/gemini/deno.lock --config runtime/iskraSpace/supabase/functions/gemini/deno.json runtime/iskraSpace/supabase/functions/gemini/index.ts
          deno check --no-lock --config runtime/iskraSpace/supabase/functions/iskra-agent/deno.json runtime/iskraSpace/supabase/functions/iskra-agent/index.ts
