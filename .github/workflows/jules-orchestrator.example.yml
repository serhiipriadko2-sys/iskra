name: Jules Orchestrator

# Example Workflow for Jules as a Platform
# This workflow demonstrates how to trigger Jules Skills based on repository events.

on:
  issues:
    types: [opened, labeled]
  pull_request:
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  jules-triage:
    if: contains(github.event.issue.labels.*.name, 'auto-code') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

