# CI retrigger only; removed in the next exact-byte commit.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build iskraSpace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install legacy runtime dependencies
        working-directory: runtime
        run: npm ci --ignore-scripts

      - name: Build @iskra/runtime
        working-directory: runtime
        run: npm run build

      - name: Verify GitHub Pages closed-beta configuration
        env:
          VITE_SUPABASE_URL: ${{ vars.ISKRASPACE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.ISKRASPACE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_ANON_KEY"

      - name: Build iskraSpace for GitHub Pages
        run: pnpm --filter iskra-space --fail-if-no-match build
        env:
          VITE_BASE_PATH: /iskra/
          VITE_SUPABASE_URL: ${{ vars.ISKRASPACE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.ISKRASPACE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_APP_VERSION: ${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: runtime/iskraSpace/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
