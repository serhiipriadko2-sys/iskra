name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "runtime/**"
      - ".github/workflows/github_pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    name: Build iskraSpace
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: runtime/package-lock.json

      - name: Install runtime dependencies
        working-directory: runtime
        run: npm ci

      - name: Build @iskra/runtime
        working-directory: runtime
        run: npm run build

      - name: Install iskraSpace dependencies
        working-directory: runtime/iskraSpace
        run: npm ci

      - name: TypeCheck iskraSpace
        working-directory: runtime/iskraSpace
        run: npm run typecheck

      - name: Build iskraSpace for GitHub Pages
        working-directory: runtime/iskraSpace
        run: npm run build
        env:
          VITE_BASE_PATH: /iskra/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: runtime/iskraSpace/dist

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
