name: Runtime CI

on:
  push:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime_ci.yml"
  pull_request:
    paths:
      - "runtime/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: runtime/package-lock.json

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install pnpm workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pnpm workspace packages
        run: pnpm build

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: runtime/node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('runtime/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: TypeScript typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee runtime-typecheck.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee runtime-build.log

      - name: Upload runtime diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: runtime-ci-diagnostics
          path: |
            runtime/runtime-typecheck.log
            runtime/runtime-build.log
          retention-days: 7

      - name: Install iskraSpace dependencies
        working-directory: runtime/iskraSpace
        run: npm ci --ignore-scripts || npm install --ignore-scripts

      - name: Run tests with coverage
        run: npm run test:coverage -- --run

      - name: Lint
        run: npm run lint