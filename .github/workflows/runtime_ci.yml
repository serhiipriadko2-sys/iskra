name: Runtime CI

on:
  push:
    paths:
      - "runtime/**"
      - ".github/workflows/runtime_ci.yml"
  pull_request:
    paths:
      - "runtime/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: runtime

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        working-directory: .
        shell: bash
        run: |
          set -o pipefail
          { node --version; pnpm --version; pnpm install --frozen-lockfile; } 2>&1 | tee runtime/workspace-install.log

      - name: Install legacy runtime dependencies
        shell: bash
        run: |
          set -o pipefail
          { node --version; npm --version; npm ci --ignore-scripts; } 2>&1 | tee runtime-install.log

      - name: TypeScript typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee runtime-typecheck.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee runtime-build.log

      - name: Upload runtime diagnostics
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: runtime-ci-diagnostics
          path: |
            runtime/workspace-install.log
            runtime/runtime-install.log
            runtime/runtime-typecheck.log
            runtime/runtime-build.log
          retention-days: 7

      - name: Run tests with coverage
        run: npm run test:coverage -- --run

      - name: Lint
        run: npm run lint
