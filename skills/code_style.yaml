skill: "code_style"
description: "Стандарты кодирования ISKRA"
rules:
  indent: 2
  quotes: "single"
  semi: true
  naming:
    variables: "camelCase"
    components: "PascalCase"
    constants: "UPPER_SNAKE_CASE"
  files:
    max_lines: 300
    component_structure:
      - "Imports"
      - "Types"
      - "Component"
      - "Hooks"
      - "Render"
