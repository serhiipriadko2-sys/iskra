# Supabase CLI config (repo-local).
#
# SECURITY: Explicitly require a valid JWT for the `embed` function.
#
# NOTE: Supabase docs mention `verify_jwt` is a legacy switch and may be
# incompatible with JWT Signing Keys. If you migrate to Signing Keys, implement
# manual JWT validation in the function (see Supabase docs/examples).

project_id = "iskra"

[functions.embed]
verify_jwt = true

[functions.gemini]
verify_jwt = true
entrypoint = "../runtime/iskraSpace/supabase/functions/gemini/index.ts"
import_map = "../runtime/iskraSpace/supabase/functions/gemini/deno.json"

[functions.iskra-agent]
verify_jwt = true
entrypoint = "../runtime/iskraSpace/supabase/functions/iskra-agent/index.ts"
import_map = "../runtime/iskraSpace/supabase/functions/iskra-agent/deno.json"

[functions.kain]
verify_jwt = true
entrypoint = "../runtime/iskraSpace/supabase/functions/kain/index.ts"
import_map = "../runtime/iskraSpace/supabase/functions/kain/deno.json"

[functions.iskra-memory-gateway]
verify_jwt = true
