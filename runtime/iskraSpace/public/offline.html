<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05080A">
  <title>Iskra offline</title>
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #05080A;
      color: #E6E8EB;
      font-family: system-ui, sans-serif;
    }
    main {
      width: min(32rem, calc(100vw - 2rem));
      padding: 2rem;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 1.5rem;
      background: #0F1216;
    }
    h1 { margin: 0 0 1rem; }
    p { color: #B8BEC7; line-height: 1.6; }
    a { color: #FF9E40; }
  </style>
</head>
<body>
  <main>
    <h1>Iskra is offline</h1>
    <p>The network is unavailable. Private chat, Supabase, Gemini, auth, and user data are not stored in the offline cache.</p>
    <p>Reconnect and refresh, or return to <a href="./">the app shell</a>.</p>
  </main>
</body>
</html>
