<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iskra Space</title>
  <script type="text/javascript">
    // GitHub Pages SPA redirect handler
    // Captures the current URL and redirects to index.html with the path stored
    // This enables SPA routing on GitHub Pages
    var pathSegmentsToKeep = 1; // For /iskra/ base path
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  <noscript>JavaScript is required to view this page. Please enable JavaScript and refresh.</noscript>
</body>
</html>
